spring:
  application:
    name: scheduler-api

  datasource:
    url: jdbc:mariadb://localhost:3306/scheduler
    username: scheduler
    password: scheduler
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  security:
    admin-api-key: "OnlyForTesting.NeedsToBeChanged"
